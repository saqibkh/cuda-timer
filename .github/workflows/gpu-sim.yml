name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so the device
# tests (test_timer, test_overhead, test_environment, test_benchmark) exit
# with code 77 and ctest reports them as skipped there. This builds the
# library and runs all tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator has no timing
# model and cannot reproduce hardware-specific behavior, so it complements
# real-GPU testing and does not replace it.

on:
  push:
    branches: [ review-fixes ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only, which the simulator runs (the CI's arch 70
      # is not supported by CUDA 13). The simulator needs a shared CUDA runtime.
      # NVTX is off because the toolkit installed on the runner has no
      # nvtx3/nvToolsExt.h header.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DCUDA_TIMER_BUILD_EXAMPLES=ON \
            -DCUDA_TIMER_BUILD_TESTS=ON \
            -DCUDA_TIMER_NVTX=OFF

      - name: Build
        run: cmake --build build -j3

      # The device tests exit 77 when no device is found, which ctest reports
      # as skipped. Here a skip means the simulated GPU was not seen, so it
      # is treated as a failure. The suite count is not hardcoded: the number
      # of test cases ctest wrote to the JUnit file must equal the number
      # registered (ctest -N). ctest writes a relative --output-junit path
      # into the build directory.
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          vgpu run ctest --test-dir build --output-junit ctest.xml --output-on-failure --no-tests=error | tee ctest.log
          if grep -qiE '\bskipped\b|did not run' ctest.log; then
            echo "::error::some tests were skipped (no CUDA device found?)"
            exit 1
          fi
          registered=$(ctest --test-dir build -N | grep -cE 'Test +#[0-9]+:')
          ran=$(grep -c '<testcase ' build/ctest.xml)
          if [ "$registered" -eq 0 ] || [ "$ran" -ne "$registered" ]; then
            echo "::error::ran $ran of $registered registered suites"
            exit 1
          fi
          echo "ran $ran of $registered registered suites, none skipped"
